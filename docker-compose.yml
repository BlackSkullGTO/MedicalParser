# Все значения (порты, креды, таймзона) берутся из файла .env в корне проекта.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TIMEZONE}
      PGTZ: ${TIMEZONE}
    # Серверная таймзона PostgreSQL: now() вернёт время в этой зоне.
    command: postgres -c timezone=${TIMEZONE}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - parser_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    env_file:
      - .env
    environment:
      # Внутри compose хосты — имена сервисов, а порты — внутренние.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: ${TIMEZONE}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.cli worker --loglevel=info --concurrency=1

volumes:
  parser_db_data:
