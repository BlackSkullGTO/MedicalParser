services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: parserdb
      POSTGRES_USER: parser
      POSTGRES_PASSWORD: parser
    ports:
      - "5432:5432"
    volumes:
      - parser_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://parser:parser@db:5432/parserdb
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://parser:parser@db:5432/parserdb
      REDIS_URL: redis://redis:6379/0
      DEBUG: "1"
    depends_on:
      - db
      - redis
    command: python -m app.cli worker --loglevel=info --concurrency=1

volumes:
  parser_db_data: